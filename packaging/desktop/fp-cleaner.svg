<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#00ff88" />
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1b1e" />
      <stop offset="100%" stop-color="#05080a" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Arka Plan Kalkanı Çerçevesi -->
  <path d="M 256,32 C 340,96 440,88 440,88 C 440,300 320,440 256,480 C 192,440 72,300 72,88 C 72,88 172,96 256,32 Z"
        fill="url(#innerGrad)" stroke="url(#shieldGrad)" stroke-width="12" stroke-linejoin="round" filter="url(#neonGlow)" />

  <!-- İç Siber Devre Çizgileri -->
  <path d="M 256,90 L 256,420" stroke="#00d4ff" stroke-width="4" stroke-dasharray="12,8" opacity="0.4" />
  <circle cx="256" cy="180" r="8" fill="#00ff88" />
  <circle cx="256" cy="320" r="8" fill="#00d4ff" />
  
  <path d="M 160,200 L 256,180 L 352,200" fill="none" stroke="#00ff88" stroke-width="4" opacity="0.6" />
  <path d="M 180,280 L 256,320 L 332,280" fill="none" stroke="#00d4ff" stroke-width="4" opacity="0.6" />

  <!-- Merkezi Parlayan Kilit ve Silici Sembolü -->
  <circle cx="256" cy="245" r="45" fill="none" stroke="url(#shieldGrad)" stroke-width="8" filter="url(#neonGlow)" />
  <rect x="236" y="225" width="40" height="40" rx="6" fill="#00ff88" />
  <circle cx="256" cy="240" r="5" fill="#000000" />
  <path d="M 256,245 L 256,255" stroke="#000000" stroke-width="3" stroke-linecap="round" />
</svg>
